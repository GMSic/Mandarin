<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mandarin Translate</title>
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#202124;--sub:#5f6368;--line:#dadce0;--blue:#1a73e8;--blue-bg:#e8f0fe;--hover:#f1f3f4;--err:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#202124;--card:#292a2d;--text:#e8eaed;--sub:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--blue-bg:#394457;--hover:#35363a;--err:#f28b82}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Google Sans",Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-size:20px}
.logo b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;background:var(--blue);color:#fff;font-weight:500}
main{max-width:980px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:var(--sub);font-size:18px}
.icon:hover{background:var(--hover)}
.langbar{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:0}
.lang{flex:1;text-align:center;padding:12px 8px;color:var(--blue);font-weight:500;border-bottom:3px solid var(--blue)}
.lang+.icon+.lang{border-bottom-color:transparent;color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--card);overflow:hidden}
.pane{padding:16px;min-height:220px}
.pane+.pane{border-left:1px solid var(--line);background:var(--bg)}
textarea{width:100%;min-height:150px;border:0;resize:vertical;background:none;color:var(--text);font:inherit;font-size:22px;line-height:1.4}
textarea::placeholder{color:var(--sub)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.primary{background:var(--blue);color:#fff;padding:9px 22px;border-radius:4px;font-weight:500}
@media (prefers-color-scheme:dark){.primary{color:#202124}}
.sug{margin-top:4px;border-top:1px solid var(--line)}
.sug button{display:flex;width:100%;gap:12px;align-items:baseline;text-align:left;padding:9px 6px;border-radius:4px}
.sug button:hover{background:var(--hover)}
.sug .m{font-size:18px}.sug .s{color:var(--sub);font-size:14px}
.ph{color:var(--sub);font-size:22px}
.main{font-size:26px;line-height:1.35;word-break:break-word}
.zh,.z,.big,.cz{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
.py{color:var(--sub);margin-top:4px}
.tools{display:flex;gap:2px;margin-top:10px}
.sec{margin-top:18px;color:var(--sub);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:44px}
.chip:hover,.chip.on{background:var(--blue-bg);border-color:var(--blue)}
.chip .p{font-size:12px;color:var(--sub)}.chip .z{font-size:24px;line-height:1.2}
.punct{align-self:flex-end;font-size:24px;color:var(--sub)}
.err{color:var(--err)}
#panel{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px}
.big{font-size:44px;line-height:1.2}
.def{font-size:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.crow{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.crow:hover,.crow.on{background:var(--blue-bg);border-color:var(--blue)}
.cz{font-size:28px;min-width:36px}.cp{color:var(--sub);min-width:70px}
#cd{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
ul.m{margin:8px 0 0;padding-left:20px}
.link{color:var(--blue);font-weight:500;padding:8px 0;margin-top:12px}
.rad{display:flex;gap:14px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rad .rs{font-size:30px;min-width:40px}
.ex{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;margin-top:6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);max-width:440px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin-top:14px;font-size:14px;color:var(--sub)}
dialog input,dialog select{width:100%;padding:10px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);margin-top:4px}
dialog p{font-size:14px;color:var(--sub)}
dialog a{color:var(--blue)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.ghost{padding:9px 16px;border-radius:4px;color:var(--blue);font-weight:500}
@media (max-width:700px){.grid{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}textarea{font-size:20px}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<header>
  <div class="logo"><b>文</b><span>Mandarin Translate</span></div>
  <button class="icon" id="gear" aria-label="Settings">⚙</button>
</header>

<main>
  <div class="langbar">
    <div class="lang" id="l1">English</div>
    <button class="icon" id="swap" aria-label="Swap languages">⇄</button>
    <div class="lang" id="l2">Chinese (Mandarin)</div>
  </div>
  <div class="grid">
    <div class="pane">
      <textarea id="inp" placeholder="Enter a word or sentence" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <div class="sug" id="sug" hidden></div>
      <div class="bar">
        <button class="icon" id="clr" aria-label="Clear">✕</button>
        <button class="primary" id="go">Translate</button>
      </div>
    </div>
    <div class="pane" id="out"><div class="ph">Translation</div></div>
  </div>
  <section id="panel" hidden></section>
</main>

<dialog id="dlg">
  <h2 style="margin:0 0 6px;font-weight:500">Connect OpenAI</h2>
  <p>Paste an OpenAI API key. It is saved only in this browser and sent only to api.openai.com. Create one at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a>. A ChatGPT subscription does not include API access, so API billing must be enabled.</p>
  <label for="key">API key</label>
  <input id="key" type="password" placeholder="sk-…" autocomplete="off">
  <label for="model">Model</label>
  <input id="model" type="text" autocapitalize="off" autocomplete="off">
  <label for="script">Characters</label>
  <select id="script"><option value="Simplified">Simplified</option><option value="Traditional">Traditional</option></select>
  <div class="row">
    <button class="ghost" id="forget">Remove key</button>
    <button class="primary" id="save">Save</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CJK = /[\u3400-\u9fff]/;

let key = store.get("oa_key", "");
let model = store.get("oa_model", "gpt-4o-mini");
let script = store.get("oa_script", "Simplified");
let src = "en", last = null, sugTimer = null, sugCtl = null, sugToken = 0;
const sugCache = new Map(), charCache = new Map();

const inp = $("#inp"), out = $("#out"), panel = $("#panel"), sug = $("#sug");

/* ---------- OpenAI ---------- */
async function ask(system, user, signal) {
  const k = key.replace(/[^\x21-\x7e]/g, "");
  if (!/^sk-/.test(k)) {
    const e = new Error("The API key looks wrong. It should start with sk- and contain no spaces or special characters.");
    e.status = 401; throw e;
  }
  const r = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
    body: JSON.stringify({
      model,
      response_format: { type: "json_object" },
      messages: [
        { role: "system", content: system + " Reply with a single JSON object only. Use " + script + " Chinese characters and pinyin with tone marks." },
        { role: "user", content: user }
      ]
    }),
    signal
  }).catch(e => {
    if (e.name === "AbortError") throw e;
    throw new Error("Could not reach OpenAI (" + e.message + "). Check your connection, turn off content blockers for this page, and open the app from its https address rather than as a local file.");
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    const err = new Error(e.error?.message || "Request failed (" + r.status + ")");
    err.status = r.status;
    throw err;
  }
  const j = await r.json();
  const txt = j.choices?.[0]?.message?.content;
  if (!txt) throw new Error("OpenAI returned an empty reply. Try a different model in settings.");
  try { return JSON.parse(txt); } catch { throw new Error("OpenAI returned a reply the app could not read. Try again."); }
}

function fail(el, e) {
  if (e.name === "AbortError") return;
  el.innerHTML = '<div class="err">' + esc((e.name && e.name !== "Error" ? e.name + ": " : "") + e.message) + (e.status === 401 ? " Check your API key in settings." : "") + "</div>";
  if (e.status === 401) openSettings();
}

/* ---------- Language bar ---------- */
function setSrc(s) {
  src = s;
  $("#l1").textContent = s === "en" ? "English" : "Chinese (Mandarin)";
  $("#l2").textContent = s === "en" ? "Chinese (Mandarin)" : "English";
  inp.lang = s === "en" ? "en" : "zh";
}
$("#swap").onclick = () => {
  const target = last ? (src === "en" ? last.chinese : last.english) : "";
  setSrc(src === "en" ? "zh" : "en");
  if (target) { inp.value = target; translate(); } else hideSug();
};

/* ---------- Translate ---------- */
async function translate() {
  const text = inp.value.trim();
  if (!text) return;
  if (!key) { openSettings(); return; }
  sugToken++; hideSug();
  if (CJK.test(text)) setSrc("zh"); else if (/[a-z]/i.test(text)) setSrc("en");
  out.innerHTML = '<div class="ph">Translating…</div>';
  panel.hidden = true;
  try {
    const r = await ask(
      'You are a Mandarin dictionary engine. Translate the text between English and Chinese. Schema: {"chinese":"","pinyin":"pinyin of the whole Chinese text","english":"","words":[{"zh":"","pinyin":"","en":"","chars":[{"zh":"","pinyin":"","en":""}]}]}. "words" segments the Chinese text in order into natural words; "chars" lists each Chinese character of that word with its own pinyin and its meaning in English. Punctuation items get empty pinyin, en and chars.',
      JSON.stringify({ text, from: CJK.test(text) ? "Chinese" : "English" })
    );
    last = r;
    renderOut(r);
  } catch (e) { fail(out, e); }
}

function renderOut(r) {
  const toZh = src === "en";
  const main = toZh ? r.chinese : r.english;
  const chips = (r.words || []).map((w, i) =>
    w.chars && w.chars.length
      ? `<button class="chip" data-w="${i}"><span class="p">${esc(w.pinyin)}</span><span class="z">${esc(w.zh)}</span></button>`
      : `<span class="punct">${esc(w.zh)}</span>`).join("");
  out.innerHTML =
    `<div class="main ${toZh ? "zh" : ""}">${esc(main)}</div>` +
    (toZh ? `<div class="py">${esc(r.pinyin)}</div>` : "") +
    `<div class="tools">
       <button class="icon" data-say="${esc(r.chinese)}" aria-label="Listen">🔊</button>
       <button class="icon" data-copy="${esc(main)}" aria-label="Copy">⧉</button>
     </div>
     <div class="sec">Tap a word to explore it</div>
     <div class="chips">${chips}</div>`;
}

/* ---------- Word and character panel ---------- */
function showWord(i, chipEl) {
  const w = last.words[i];
  w.chars = w.chars || [];
  document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
  chipEl.classList.add("on");
  panel.hidden = false;
  panel.innerHTML =
    `<div class="top"><div>
       <div class="big">${esc(w.zh)}</div>
       <div class="py">${esc(w.pinyin)}</div>
       <div class="def">${esc(w.en)}</div>
     </div><button class="icon" data-say="${esc(w.zh)}" aria-label="Listen">🔊</button></div>` +
    (w.chars.length > 1
      ? `<div class="sec">Characters in this word</div>` +
        w.chars.map(c => `<button class="crow" data-c="${esc(c.zh)}"><span class="cz">${esc(c.zh)}</span><span class="cp">${esc(c.pinyin)}</span><span class="ce">${esc(c.en)}</span></button>`).join("")
      : "") +
    `<div id="cd"></div>`;
  if (w.chars.length === 1) showChar(w.chars[0].zh);
  panel.scrollIntoView({ block: "nearest" });
}

async function showChar(ch, rowEl) {
  document.querySelectorAll(".crow.on").forEach(c => c.classList.remove("on"));
  if (rowEl) rowEl.classList.add("on");
  const cd = $("#cd");
  cd.innerHTML = '<div class="ph" style="font-size:16px">Loading…</div>';
  try {
    let d = charCache.get(ch + script);
    if (!d) {
      d = await ask(
        'You are a Chinese character dictionary. Describe one character. Schema: {"char":"","pinyin":"","meanings":["up to 4 short English meanings"],"radicals":[{"symbol":"","name":"English name","pinyin":"","meaning":"what it means or contributes"}],"explanation":"2-3 sentences on how the components combine to suggest the meaning or sound","examples":[{"zh":"common word using it","pinyin":"","en":""}]}. Give at most 3 examples. List every component, marking the main radical in its name.',
        JSON.stringify({ character: ch })
      );
      charCache.set(ch + script, d);
    }
    cd.innerHTML =
      `<div class="top"><div>
         <div class="big">${esc(d.char || ch)}</div>
         <div class="py">${esc(d.pinyin)}</div>
       </div><button class="icon" data-say="${esc(ch)}" aria-label="Listen">🔊</button></div>
       <ul class="m">${(d.meanings || []).map(m => `<li class="def">${esc(m)}</li>`).join("")}</ul>` +
      ((d.examples || []).length ? `<div class="sec">Used in</div>` + d.examples.map(x => `<div class="ex"><span class="z" style="font-size:20px">${esc(x.zh)}</span><span class="py" style="margin:0">${esc(x.pinyin)}</span><span>${esc(x.en)}</span></div>`).join("") : "") +
      `<button class="link" id="rbtn" aria-expanded="false">Explain radicals ▾</button>
       <div id="rad" hidden>` +
      (d.radicals || []).map(r => `<div class="rad"><span class="rs z">${esc(r.symbol)}</span><div><div>${esc(r.name)} <span class="py" style="margin:0">${esc(r.pinyin)}</span></div><div class="py" style="margin:0">${esc(r.meaning)}</div></div></div>`).join("") +
      `<p>${esc(d.explanation)}</p></div>`;
  } catch (e) { fail(cd, e); }
}

/* ---------- Live suggestions ---------- */
function hideSug() { sug.hidden = true; sug.innerHTML = ""; if (sugCtl) sugCtl.abort(); }

inp.addEventListener("input", () => {
  const t = inp.value;
  if (CJK.test(t) && src === "en") setSrc("zh");
  else if (/[a-z]/i.test(t) && !CJK.test(t) && src === "zh") setSrc("en");
  clearTimeout(sugTimer);
  const q = t.trim();
  if (!key || !q || q.length > 40 || q.includes("\n") || (src === "en" && q.length < 2)) { hideSug(); return; }
  sugTimer = setTimeout(() => suggest(q), 350);
});

async function suggest(q) {
  const token = ++sugToken;
  const ck = src + "|" + script + "|" + q.toLowerCase();
  let items = sugCache.get(ck);
  try {
    if (!items) {
      if (sugCtl) sugCtl.abort();
      sugCtl = new AbortController();
      const r = await ask(
        'You power search autocomplete for a Mandarin learner. Suggest up to 5 common words or short phrases that complete or relate to what the user is typing. Schema: {"suggestions":[{"zh":"","pinyin":"","en":""}]}',
        JSON.stringify({ typing: q, language: src === "en" ? "English" : "Chinese" }),
        sugCtl.signal
      );
      items = (r.suggestions || []).slice(0, 5);
      sugCache.set(ck, items);
    }
    if (token !== sugToken) return;
    sug.hidden = !items.length;
    sug.innerHTML = items.map(s => {
      const main = src === "en" ? s.en : s.zh;
      const sub = src === "en" ? `${s.zh} · ${s.pinyin}` : `${s.pinyin} · ${s.en}`;
      return `<button data-s="${esc(main)}"><span class="m ${src === "zh" ? "zh" : ""}">${esc(main)}</span><span class="s">${esc(sub)}</span></button>`;
    }).join("");
  } catch (e) { if (e.name !== "AbortError") hideSug(); }
}

/* ---------- Events ---------- */
sug.addEventListener("click", e => {
  const b = e.target.closest("[data-s]");
  if (b) { inp.value = b.dataset.s; translate(); }
});
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) return showWord(+chip.dataset.w, chip);
  const row = e.target.closest(".crow");
  if (row) return showChar(row.dataset.c, row);
  const say = e.target.closest("[data-say]");
  if (say) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(say.dataset.say); u.lang = "zh-CN"; speechSynthesis.speak(u); } catch {} return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { try { navigator.clipboard.writeText(cp.dataset.copy); } catch {} return; }
  if (e.target.closest("#rbtn")) {
    const b = $("#rbtn"), r = $("#rad");
    r.hidden = !r.hidden;
    b.setAttribute("aria-expanded", String(!r.hidden));
    b.textContent = r.hidden ? "Explain radicals ▾" : "Hide radicals ▴";
    if (!r.hidden) r.scrollIntoView({ block: "nearest" });
  }
});
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); translate(); } });
$("#go").onclick = translate;
$("#clr").onclick = () => { inp.value = ""; hideSug(); out.innerHTML = '<div class="ph">Translation</div>'; panel.hidden = true; last = null; inp.focus(); };

/* ---------- Settings ---------- */
const dlg = $("#dlg");
function openSettings() {
  $("#key").value = key; $("#model").value = model; $("#script").value = script;
  if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
}
$("#gear").onclick = openSettings;
$("#save").onclick = () => {
  key = $("#key").value.trim(); model = $("#model").value.trim() || "gpt-4o-mini"; script = $("#script").value;
  store.set("oa_key", key); store.set("oa_model", model); store.set("oa_script", script);
  charCache.clear(); sugCache.clear();
  if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
};
$("#forget").onclick = () => { key = ""; store.del("oa_key"); $("#key").value = ""; };
if (!key) openSettings();

/* Show any unexpected error on screen */
const showErr = m => { out.innerHTML = '<div class="err">' + esc(m) + "</div>"; };
window.addEventListener("error", e => showErr(e.message));
window.addEventListener("unhandledrejection", e => showErr(e.reason && e.reason.message ? e.reason.message : String(e.reason)));
</script>
</body>
</html>
